[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kikiam-bio-security"
version = "0.1.0"
description = "Local biometric security research and benchmarking laboratory."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "opencv-python==4.14.0.94",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[project.scripts]
bio-security = "bio_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bio_security"]
