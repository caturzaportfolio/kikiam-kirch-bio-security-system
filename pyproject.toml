[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kikiam-bio-security"
version = "0.1.0"
description = "Local biometric security research and benchmarking laboratory."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
bio-security = "bio_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bio_security"]
